services:
  - type: web
    name: commonground-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DB_NAME
        value: commonground
      - key: MONGODB_URI
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: CLIENT_URLS
        sync: false
